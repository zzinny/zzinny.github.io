<div class="sidebar-header">
    <a href="/" class="menu-item logo">Jieun Kim</a>
    <button id="menu-toggle" class="toggle-btn">☰</button>
</div>
            
<div id="menu-content" class="menu-content">
    <a href="/about" class="menu-item">About</a>
    
    <div class="menu-group">
        <span class="menu-item works-title">Works</span>
        <div class="submenu">
            <a href="/works/camera-based">film & photography</a>
            <a href="/works/computational-media">computational media</a>
        </div>
    </div>
</div>

<script>
    const toggleBtn = document.getElementById('menu-toggle');
    const menuContent = document.getElementById('menu-content');

    toggleBtn.addEventListener('click', () => {
        // menu-content 요소에 'active' 클래스를 꼈다 뺐다(Toggle) 합니다.
        menuContent.classList.toggle('active');
        if (menuContent.classList.contains('active')) {
            toggleBtn.textContent = '✕';
        } else {
            toggleBtn.textContent = '☰';
        }
    });
</script>
